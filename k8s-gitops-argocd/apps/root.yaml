# App-of-apps: apply once; ArgoCD then manages everything under apps/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/menakamaheswari1234-cpu/k8s-gitops-argocd.git
    targetRevision: main
    path: apps
    directory:
      exclude: root.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
