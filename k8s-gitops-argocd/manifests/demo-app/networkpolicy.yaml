apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: demo
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-to-demo-app
  namespace: demo
spec:
  podSelector:
    matchLabels: {app: demo-app}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 9898, protocol: TCP}
